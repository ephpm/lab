# Proxy benchmark lane. Everything that could confound the comparison is
# pinned here rather than inherited from the image's baked test config:
#  * rate limiter effectively disabled (a single-IP load test against
#    per_ip_rate=500 measures the limiter, not the server)
#  * query_stats OFF (TrackedBackend taxes the wire path specifically)

[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/html"
index_files = ["index.php", "index.html"]

[server.limits]
max_connections = 1024
per_ip_rate = 1000000.0
per_ip_burst = 1000000

[php]
mode = "fpm"

[db.analysis]
query_stats = false

[db.postgres]

url = "postgres://postgres:bench@dbbench-pg:5432/bench"
listen = "127.0.0.1:5432"
min_connections = 4
max_connections = 32
idle_timeout = "300s"
max_lifetime = "1800s"
pool_timeout = "5s"
health_check_interval = "300s"
reset_strategy = "smart"
inject_env = true
