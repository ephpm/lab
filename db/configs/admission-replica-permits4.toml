# Lane C, node 2 -- CLUSTERED SQLite replica (sqld sidecar).
#
# role = "replica" REQUIRES primary_grpc_url; sqld's grpc listener
# defaults to 0.0.0.0:5001, so the replica points at the primary
# container's 5001.

[server]
listen = "0.0.0.0:8080"
document_root = "/var/www/html"
index_files = ["index.php", "index.html"]

[server.limits]
max_connections = 1024
per_ip_rate = 1000000.0
per_ip_burst = 1000000

[php]
mode = "fpm"

[db.sqlite]
path = "/data/bench.db"
engine = "sqlite"

[db.sqlite.sqld]
write_permits = 4

[db.sqlite.replication]
role = "replica"
primary_grpc_url = "http://10.89.1.11:5001"

[db.analysis]
query_stats = false

[cluster]
enabled = true
bind = "10.89.1.12:7946"
join = ["10.89.1.11:7946"]
node_id = "node-2"
cluster_id = "dbbench"
secret = "bench-only-not-a-real-secret-000000000000"
